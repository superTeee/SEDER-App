name: Vitola
options:
  bundleIdPrefix: com.tomerikheggedal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.0.0
  Mantis:
    url: https://github.com/guoyingtao/Mantis
    from: 2.0.0

targets:
  Vitola:
    type: application
    platform: iOS
    sources:
      - path: CigarApp
        excludes:
          - "**/.DS_Store"
    resources:
      - CigarApp/Assets.xcassets
      - CigarApp/Preview Content
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Kingfisher
        product: Kingfisher
      - package: Mantis
        product: Mantis
    entitlements:
      path: CigarApp/Vitola.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: CigarApp/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1080195891334-sssk6g0avcs1rdr2srbhi9faedchqilo
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.tomerikheggedal.vitola
            CFBundleURLSchemes:
              - vitola
        NSCameraUsageDescription: "Vitola bruker kameraet til å scanne sigarbandet"
        NSPhotoLibraryUsageDescription: "Velg et bilde av et sigarband fra biblioteket ditt"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomerikheggedal.vitola
        DEVELOPMENT_TEAM: H7NS3V5EFA
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "193"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
      debug:
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      release:
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_OPTIMIZATION_LEVEL: "-O"
